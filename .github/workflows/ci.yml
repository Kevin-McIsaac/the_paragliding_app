name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: the_paragliding_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        # .env is declared as an asset in pubspec.yaml, so it must exist for the
        # bundle to build. Analyze and test never call the APIs, so placeholder
        # values from .env.example are enough - no secrets needed.
        run: cp .env.example .env

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
