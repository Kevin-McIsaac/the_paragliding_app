name: CI

# Actions are pinned to commit SHAs, with the release they came from in a trailing
# comment. See the note at the top of build.yml for why.

on:
  push:
    branches:
      - main
  pull_request:

# Superseded pushes to a PR branch have nothing left to prove; let the newest win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared rather than inherited, so a job gaining write access has to be a
# visible edit here. Nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  # build.yml carries a near-copy of this job, because the release path must not
  # depend on this workflow having run. Change one and change the other.
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: the_paragliding_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        # --concurrency=1 is kept as a precaution, not because the suite is still
        # flaky. #280 fixed that, and parallel now passes 16 consecutive runs -
        # but only measured on an 8-core dev box, and hosted runners have far
        # fewer cores. Re-measure here before dropping this.
        # This cannot live in dart_test.yaml - flutter test always passes its own
        # -j and overrides the file.
        run: flutter test --concurrency=1

      - name: Test date ranges in a DST timezone
        # Runners are UTC, which has no DST - date arithmetic that loses a day
        # across a spring-forward boundary passes here and breaks for real users.
        # Scoped to the date-range tests on purpose: running the whole suite a
        # second time would double CI's runtime without adding DST coverage.
        env:
          TZ: America/New_York
        run: flutter test --concurrency=1 test/date_range_test.dart
