# Test tags.
#
# `network` marks tests that call a live third-party service. They are skipped by
# default so a normal `flutter test` stays deterministic and offline - a stalled
# network test holds a concurrency slot long enough to push unrelated files past
# the 30s default timeout.
#
# Run them deliberately:  flutter test --tags network --run-skipped
#
# NOTE: `concurrency:` does not belong here - `flutter test` always passes its own
# `-j` and overrides whatever this file says. Serialisation is set on the command
# line instead; see .github/workflows/ci.yml.
tags:
  network:
    # Deliberately names no single service - more than one is covered now
    # (ParaglidingEarth, the OpenAIP export bucket), and a message naming only
    # one reads as "this test hits ParaglidingEarth" when it does not.
    skip: "Hits a live third-party service; run with --tags network --run-skipped"
